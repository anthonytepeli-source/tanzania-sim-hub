<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscillation Simulator — T·SIMHUB</title>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#fff;color:#000;
    font-family:"Times New Roman", Times, Georgia, serif;font-size:12pt;line-height:1.35;}

  .topbar{position:sticky;top:0;z-index:100;background:rgba(5,8,16,0.92);backdrop-filter:blur(14px);border-bottom:1px solid rgba(180,205,240,0.12);}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:11px 32px;display:flex;align-items:center;justify-content:space-between;gap:20px;}
  @media(max-width:640px){.topbar-inner{padding:10px 18px;}}
  .banner{display:inline-flex;align-items:baseline;gap:11px;color:#fff;text-decoration:none;white-space:nowrap;}
  .banner .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ffd97a;box-shadow:0 0 12px rgba(255,217,122,0.85);position:relative;top:1px;animation:pulse 3s ease-in-out infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px rgba(255,217,122,0.85);}50%{box-shadow:0 0 20px rgba(255,217,122,1);}}
  .banner .main{font-size:14.5px;font-weight:bold;}
  .banner .sub{font-size:12.5px;font-style:italic;color:rgba(255,255,255,0.72);}
  .banner .sub::before{content:"·";margin-right:8px;color:rgba(255,255,255,0.4);}
  @media(max-width:520px){.banner .sub{display:none;}}

  .status{font-size:11pt;font-style:italic;color:#fff;flex:none;}
  .status .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#666;margin-right:6px;vertical-align:middle;transition:background .2s;}
  .status.running .dot{background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,.7);}
  .status.paused  .dot{background:#f59e0b;box-shadow:0 0 8px rgba(245,158,11,.6);}

  .app{display:flex;flex-direction:column;padding:10px 20px 16px;gap:6px;}

  .case-tabs{display:flex;gap:20px;padding:6px 0 8px;flex-wrap:wrap;border-bottom:1.5px solid #000;}
  .case-tab{background:none;border:none;padding:0 0 3px;font-family:inherit;
    font-size:11pt;font-style:italic;color:#000;cursor:pointer;border-bottom:2px solid transparent;}
  .case-tab.active{font-weight:bold;font-style:normal;border-bottom-color:#000;}

  .stage{display:flex;flex-direction:column;gap:8px;padding-top:8px;}

  .row-main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;
    border-bottom:1.5px solid #000;padding-bottom:8px;}
  @media(max-width:960px){.row-main{grid-template-columns:1fr;}.circ-panel{height:32vh;}}

  .sim-wrap{display:flex;flex-direction:column;gap:4px;min-width:0;}
  .sim-wrap .panel{
    position:relative;width:100%;height:48vh;min-height:320px;max-height:480px;
    background:#fff;display:flex;align-items:center;justify-content:center;
    border:1px solid #d0d0d0;
  }
  .sim-wrap .panel canvas{display:block;touch-action:none;user-select:none;cursor:default;}

  .circ-panel{
    position:relative;height:48vh;min-height:320px;max-height:480px;
    background:#fff;border:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;min-width:0;
  }
  .circ-panel canvas{display:block;background:#fff;}

  .control-row{display:flex;justify-content:center;align-items:center;gap:30px;padding:4px 0 0;flex-wrap:wrap;}
  .btn{background:none;border:none;padding:0 0 2px;font-family:inherit;font-size:12pt;
    color:#000;cursor:pointer;border-bottom:1.5px solid #000;font-weight:bold;}
  .btn:active{color:#555;border-bottom-color:#555;}
  .vec-toggle{
    display:inline-flex;align-items:center;gap:6px;
    font-family:inherit;font-size:11pt;font-style:italic;
    cursor:pointer;user-select:none;padding-bottom:2px;
    border-bottom:1.5px dotted #666;
  }
  .vec-toggle input{cursor:pointer;accent-color:#1d4ed8;width:14px;height:14px;}

  .row-graphs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
    border-bottom:1.5px solid #000;padding-bottom:8px;}
  @media(max-width:960px){.row-graphs{grid-template-columns:1fr;}}
  .row-graphs .panel{
    position:relative;height:32vh;min-height:230px;max-height:300px;
    background:#fff;border:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;min-width:0;
  }
  .row-graphs .panel canvas{display:block;background:#fff;}

  .row-bottom{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px;padding-bottom:6px;}
  @media(max-width:960px){.row-bottom{grid-template-columns:1fr;}}
  .row-bottom .panel{
    position:relative;height:34vh;min-height:240px;max-height:320px;
    background:#fff;border:1px solid #d0d0d0;
    display:flex;align-items:center;justify-content:center;min-width:0;
  }
  .row-bottom .panel canvas{display:block;background:#fff;}

  .data-strip{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;
    border:1px solid #d0d0d0;padding:10px 14px;background:#fff;min-width:0;}
  @media(max-width:640px){.data-strip{grid-template-columns:1fr;gap:14px;}}
  .data-col{padding:0 12px;border-right:1px solid #d8d8d8;min-width:0;}
  .data-col:first-child{padding-left:0;}
  .data-col:last-child{padding-right:0;border-right:none;}
  .data-col h3{margin:0 0 6px;font-size:11pt;font-weight:bold;font-style:italic;color:#000;}

  .data-list{font-size:11pt;line-height:1.55;color:#000;}
  .data-list .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .data-list .k{font-style:italic;color:#000;}
  .data-list .v{font-weight:bold;color:#000;white-space:nowrap;}
  .data-list .v .u{font-weight:normal;font-style:italic;margin-left:3px;font-size:10pt;color:#000;}

  .formula-block{font-size:11pt;font-style:italic;margin:0 0 6px;color:#000;}
  .period-line{display:flex;justify-content:space-between;align-items:baseline;
    font-size:11pt;margin-bottom:3px;color:#000;}
  .period-line .k{font-style:italic;}
  .period-line .v{font-weight:bold;}
  .period-line .v .u{font-weight:normal;font-style:italic;margin-left:2px;font-size:10pt;}

  .energy-item{display:grid;grid-template-columns:52px 1fr 42px;align-items:center;
    gap:6px;margin-bottom:5px;font-size:11pt;}
  .energy-item .lbl{font-style:italic;color:#000;font-size:10pt;}
  .energy-item .track{height:6px;background:#e0e0e0;overflow:hidden;}
  .energy-item .fill{height:100%;width:0%;background:#000;display:block;transition:width .05s linear;}
  .energy-item.ke .fill{background:#e53935;}
  .energy-item.pe .fill{background:#1a5fb4;}
  .energy-item.total .fill{background:#26a69a;}
  .energy-item .val{font-weight:bold;text-align:right;font-size:11pt;color:#000;}
  .energy-total-line{margin-top:5px;font-size:11pt;display:flex;justify-content:space-between;color:#000;}
  .energy-total-line .k{font-style:italic;}
  .energy-total-line .v{font-weight:bold;}

  #paramWin{
    position:fixed;top:130px;right:20px;z-index:600;
    background:#fff;border:1.6px solid #000;border-radius:14px;
    box-shadow:0 4px 16px rgba(0,0,0,0.18);
    max-width:230px;font-family:inherit;font-size:10pt;
    user-select:none;overflow:hidden;
  }
  #paramWin .fw-head{display:flex;align-items:center;justify-content:space-between;
    padding:6px 10px;background:#f6f6f6;border-bottom:1px solid #d0d0d0;
    cursor:move;touch-action:none;}
  #paramWin .fw-head .fw-title{font-weight:bold;font-style:italic;font-size:10.5pt;color:#000;}
  #paramWin .fw-head .fw-grip{display:inline-block;width:14px;height:8px;
    background-image:linear-gradient(#333 1.5px, transparent 1.5px);
    background-size:100% 3px;opacity:.7;}
  #paramWin .fw-body{padding:8px 10px 10px;max-height:380px;overflow-y:auto;}

  .param{margin-bottom:6px;}
  .param:last-child{margin-bottom:0;}
  .param-row{display:flex;justify-content:space-between;align-items:baseline;
    font-size:10pt;margin-bottom:2px;gap:6px;}
  .param-row .name{font-style:italic;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .param-row .value{font-weight:bold;color:#000;white-space:nowrap;font-size:10pt;}
  .param input[type="range"]{width:100%;-webkit-appearance:none;appearance:none;
    height:3.5px;background:#000;outline:none;cursor:pointer;display:block;border-radius:0;}
  .param input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:12px;height:12px;border-radius:50%;background:#000;border:none;cursor:grab;}
  .param input[type="range"]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;
    background:#000;border:none;cursor:grab;}

  .toast{position:fixed;bottom:18px;left:50%;
    transform:translateX(-50%) translateY(60px);
    background:#000;color:#fff;padding:7px 16px;
    font-size:11.5pt;font-style:italic;font-weight:bold;
    opacity:0;pointer-events:none;
    transition:opacity .22s, transform .22s;z-index:900;border-radius:3px;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a class="banner" href="../../../../">
      <span class="dot"></span>
      <span class="main">Tanzania Simulation Hub</span>
      <span class="sub">T·SIMHUB</span>
    </a>
    <span class="status" id="statusTag"><span class="dot"></span><span id="statusText">Ready</span></span>
  </div>
</div>

<div class="app">
  <nav class="case-tabs" id="caseTabs"></nav>

  <div class="stage">
    <div class="row-main">
      <div class="sim-wrap">
        <div class="panel" id="simPanel"><canvas id="simCanvas"></canvas></div>
        <div class="control-row">
          <button class="btn" id="btnRelease">Release</button>
          <button class="btn" id="btnPause">Pause</button>
          <button class="btn" id="btnReset">Reset</button>
          <label class="vec-toggle" title="Show x, F and v arrows">
            <input type="checkbox" id="vecToggle" checked>
            <span>Vectors (x, F, v)</span>
          </label>
        </div>
      </div>
      <div class="panel circ-panel" id="circPanel"><canvas id="circCanvas"></canvas></div>
    </div>

    <div class="row-graphs">
      <div class="panel"><canvas id="dispCanvas"></canvas></div>
      <div class="panel"><canvas id="velCanvas"></canvas></div>
      <div class="panel"><canvas id="accCanvas"></canvas></div>
    </div>

    <div class="row-bottom">
      <div class="panel"><canvas id="enCanvas"></canvas></div>
      <div class="data-strip">
        <div class="data-col">
          <h3>Live data</h3>
          <div class="data-list">
            <div class="row"><span class="k" id="lbl-x">Displacement <i>x</i></span><span class="v" id="readX">0.00<span class="u">m</span></span></div>
            <div class="row"><span class="k">Phase <i>&phi;</i></span><span class="v" id="readPhi">0&deg;</span></div>
            <div class="row"><span class="k" id="lbl-v">Velocity <i>v</i></span><span class="v" id="readV">0.000<span class="u">m/s</span></span></div>
            <div class="row"><span class="k">Acceleration <i>a</i></span><span class="v" id="readA">0.000<span class="u">m/s²</span></span></div>
            <div class="row"><span class="k">Time <i>t</i></span><span class="v" id="readT">0.00<span class="u">s</span></span></div>
          </div>
        </div>
        <div class="data-col">
          <h3>Theoretical period</h3>
          <div class="formula-block" id="formulaBlock">T = 2&pi; &radic;( L / g )</div>
          <div class="period-line"><span class="k">Calculated</span><span class="v" id="readTth">2.006<span class="u">s</span></span></div>
          <div class="period-line"><span class="k">Measured</span><span class="v" id="readTmeas">&mdash;</span></div>
        </div>
        <div class="data-col">
          <h3>Energy distribution</h3>
          <div class="energy-item ke"><span class="lbl">K = ½mv²</span><span class="track"><span class="fill" id="barKE"></span></span><span class="val" id="valKE">0%</span></div>
          <div class="energy-item pe"><span class="lbl">U = ½kx²</span><span class="track"><span class="fill" id="barPE"></span></span><span class="val" id="valPE">100%</span></div>
          <div class="energy-item total"><span class="lbl">E_total</span><span class="track"><span class="fill" id="barTE" style="width:100%;"></span></span><span class="val" id="valTE">100%</span></div>
          <div class="energy-total-line"><span class="k">Total energy</span><span class="v" id="readEtotal">1.90 mJ</span></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="paramWin">
  <div class="fw-head" id="paramHead"><span class="fw-title">Parameters</span><span class="fw-grip"></span></div>
  <div class="fw-body" id="paramList"></div>
</div>

<div class="toast" id="toast"><span id="toastMsg">Ready</span></div>

<script>
const PI = Math.PI, TWO_PI = 2*PI, DEG = PI/180;
const FONT = '"Times New Roman", Times, Georgia, serif';
let showVectors = true;

const state = {
  caseId: 'pendulum',
  x: 0, v: 0, t: 0, phi: 0,
  running:false, history:[], lastCrossT:null, measuredT:null,
  L:1.00, m:0.20, g:9.81, b:0.00, A:0.25,
  theta0:8*DEG, k:20,
  Lp:0.80, theta0p:30*DEG,
  kappa:0.50, I:0.020, theta0t:45*DEG,
  h0c:0.10,
  Lc:0.30, Cc:0.005, Rc:5, Q0:2.0e-3,
  F0:0.50, omega_d:8.0
};

function drawGridPaper(){
  ctx.fillStyle='#fdfcf6'; ctx.fillRect(0,0,SIM_VW,SIM_VH);
  ctx.strokeStyle='rgba(140,195,140,0.42)'; ctx.lineWidth=1;
  ctx.beginPath();
  for (let x=0;x<=SIM_VW;x+=20){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,SIM_VH); }
  for (let y=0;y<=SIM_VH;y+=20){ ctx.moveTo(0,y+0.5); ctx.lineTo(SIM_VW,y+0.5); }
  ctx.stroke();
  ctx.strokeStyle='rgba(225,130,130,0.55)'; ctx.lineWidth=1.2;
  ctx.beginPath();
  for (let x=0;x<=SIM_VW;x+=100){ ctx.moveTo(x+0.5,0); ctx.lineTo(x+0.5,SIM_VH); }
  for (let y=0;y<=SIM_VH;y+=100){ ctx.moveTo(0,y+0.5); ctx.lineTo(SIM_VW,y+0.5); }
  ctx.stroke();
}

function drawArrow(g, x1, y1, x2, y2, color, label){
  const dx = x2-x1, dy = y2-y1;
  const len = Math.hypot(dx, dy);
  if (len < 4) return;
  const ang = Math.atan2(dy, dx);
  const head = Math.min(12, len*0.32);
  g.strokeStyle = color; g.fillStyle = color; g.lineWidth = 2.4;
  g.beginPath();
  g.moveTo(x1, y1);
  g.lineTo(x2 - head*0.9*Math.cos(ang), y2 - head*0.9*Math.sin(ang));
  g.stroke();
  g.beginPath();
  g.moveTo(x2, y2);
  g.lineTo(x2 - head*Math.cos(ang - 0.45), y2 - head*Math.sin(ang - 0.45));
  g.lineTo(x2 - head*Math.cos(ang + 0.45), y2 - head*Math.sin(ang + 0.45));
  g.closePath(); g.fill();
  if (label){
    g.font = 'bold italic 18px ' + FONT;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, x2 + Math.cos(ang)*18, y2 + Math.sin(ang)*18);
  }
}

function lineSegDist(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const l2 = dx*dx + dy*dy;
  if (l2 < 1) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
}

const CASES = {};

CASES['spring-h'] = {
  label:'Spring (horizontal)',
  xUnit:'m', vUnit:'m s⁻¹', aUnit:'m s⁻²', yUnitDeg:false, ampKey:'A',
  params:[
    { key:'m', label:'Mass', sym:'m', unit:'kg', min:0.05, max:2.00, step:0.01, dec:2 },
    { key:'k', label:'Spring const.', sym:'k', unit:'N m⁻¹', min:2, max:60, step:0.5, dec:1 },
    { key:'A', label:'Amplitude', sym:'A', unit:'m', min:0.02, max:0.60, step:0.01, dec:2 },
    { key:'b', label:'Damping', sym:'b', unit:'s⁻¹', min:0, max:6, step:0.05, dec:2 }
  ],
  omega0:()=>Math.sqrt(state.k/state.m),
  accel:(x,v)=>-(state.k/state.m)*x - state.b*v,
  initX:()=>state.A,
  formula:'T = 2&pi; &radic;( m / k )',
  render:renderSpringH,
  energyFormula:()=>0.5*state.k*state.A*state.A,
  getHandle:()=>({x:SIM_VW*0.58+state.x*180, y:SIM_VH*0.52, r:50}),
  dragTo:(vx)=>{let x=(vx-SIM_VW*0.58)/180; x=Math.max(-0.60,Math.min(0.60,x)); state.x=x; state.v=0; updateParamSlider('A',Math.abs(x));}
};

CASES['spring-v'] = {
  label:'Spring (vertical)',
  xUnit:'m', vUnit:'m s⁻¹', aUnit:'m s⁻²', yUnitDeg:false, ampKey:'A',
  params:[
    { key:'m', label:'Mass', sym:'m', unit:'kg', min:0.05, max:2.00, step:0.01, dec:2 },
    { key:'k', label:'Spring const.', sym:'k', unit:'N m⁻¹', min:2, max:60, step:0.5, dec:1 },
    { key:'A', label:'Amplitude', sym:'A', unit:'m', min:0.02, max:0.40, step:0.01, dec:2 },
    { key:'b', label:'Damping', sym:'b', unit:'s⁻¹', min:0, max:6, step:0.05, dec:2 }
  ],
  omega0:()=>Math.sqrt(state.k/state.m),
  accel:(x,v)=>-(state.k/state.m)*x - state.b*v,
  initX:()=>state.A,
  formula:'T = 2&pi; &radic;( m / k )',
  render:renderSpringV,
  energyFormula:()=>0.5*state.k*state.A*state.A,
  getHandle:()=>({x:SIM_VW/2, y:SIM_VH*0.55+state.x*260, r:56}),
  dragTo:(vx,vy)=>{let x=(vy-SIM_VH*0.55)/260; x=Math.max(-0.40,Math.min(0.40,x)); state.x=x; state.v=0; updateParamSlider('A',Math.abs(x));}
};

CASES['spring-double'] = {
  label:'Double spring',
  xUnit:'m', vUnit:'m s⁻¹', aUnit:'m s⁻²', yUnitDeg:false, ampKey:'A',
  params:[
    { key:'m', label:'Mass', sym:'m', unit:'kg', min:0.05, max:2.00, step:0.01, dec:2 },
    { key:'k', label:'Each spring const.', sym:'k', unit:'N m⁻¹', min:2, max:60, step:0.5, dec:1 },
    { key:'A', label:'Amplitude', sym:'A', unit:'m', min:0.02, max:0.40, step:0.01, dec:2 },
    { key:'b', label:'Damping', sym:'b', unit:'s⁻¹', min:0, max:6, step:0.05, dec:2 }
  ],
  omega0:()=>Math.sqrt(2*state.k/state.m),
  accel:(x,v)=>-(2*state.k/state.m)*x - state.b*v,
  initX:()=>state.A,
  formula:'T = 2&pi; &radic;( m / 2k )',
  render:renderSpringDouble,
  energyFormula:()=>0.5*(2*state.k)*state.A*state.A,
  getHandle:()=>({x:SIM_VW/2+state.x*170, y:SIM_VH*0.52, r:50}),
  dragTo:(vx)=>{let x=(vx-SIM_VW/2)/170; x=Math.max(-0.40,Math.min(0.40,x)); state.x=x; state.v=0; updateParamSlider('A',Math.abs(x));}
};

CASES['pendulum'] = {
  label:'Pendulum',
  xUnit:'°', vUnit:'rad s⁻¹', aUnit:'rad s⁻²', yUnitDeg:true, ampKey:'theta0',
  params:[
    { key:'L', label:'Length', sym:'L', unit:'m', min:0.40, max:3.00, step:0.02, dec:2 },
    { key:'m', label:'Mass', sym:'m', unit:'kg', min:0.05, max:1.00, step:0.01, dec:2 },
    { key:'g', label:'Gravity', sym:'g', unit:'m s⁻²', min:1.00, max:25.0, step:0.05, dec:2 },
    { key:'b', label:'Damping', sym:'b', unit:'s⁻¹', min:0, max:10, step:0.02, dec:2 },
    { key:'theta0', label:'Initial angle', sym:'θ', sub:'0', unit:'°', min:2, max:40, step:0.5, dec:1, scale:DEG }
  ],
  omega0:()=>Math.sqrt(state.g/state.L),
  accel:(x,v)=>-(state.g/state.L)*Math.sin(x) - state.b*v,
  initX:()=>state.theta0,
  formula:'T = 2&pi; &radic;( L / g )',
  render:renderPendulum,
  energyFormula:()=>state.m*state.g*state.L*(1-Math.cos(state.theta0)),
  getHandle:()=>{
    const PX=SIM_VW/2, PY=80, Lv=140+state.L*70;
    return {x:PX+Lv*Math.sin(state.x), y:PY+Lv*Math.cos(state.x), r:14+state.m*10+20};
  },
  dragTo:(vx,vy)=>{
    const PX=SIM_VW/2, PY=80;
    let th=Math.atan2(vx-PX, vy-PY);
    const max=40*DEG;
    th=Math.max(-max, Math.min(max, th));
    state.x=th; state.v=0;
    updateParamSlider('theta0', Math.abs(th)/DEG);
  }
};

CASES['physical-pendulum'] = {
  label:'Physical pendulum',
  xUnit:'°', vUnit:'rad s⁻¹', aUnit:'rad s⁻²', yUnitDeg:true, ampKey:'theta0p',
  params:[

function syncCanvas(canvas, g, panel, vW, vH){
  const availW = Math.max(80, panel.clientWidth-4);
  const availH = Math.max(60, panel.clientHeight-4);
  const aspect = vW/vH;
  let w=availW, h=w/aspect;
  if (h > availH){ h=availH; w=h*aspect; }
  w=Math.round(w); h=Math.round(h);
  const dpr = window.devicePixelRatio || 1;
  const needW=Math.round(w*dpr), needH=Math.round(h*dpr);
  if (canvas.width!==needW || canvas.height!==needH){
    canvas.width=needW; canvas.height=needH;
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
  }
  g.setTransform(needW/vW, 0, 0, needH/vH, 0, 0);
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  g.lineCap='round'; g.lineJoin='round'; g.textBaseline='alphabetic';
}

function currentCase(){ return CASES[state.caseId]; }
function omega0(){ return currentCase().omega0(); }
function accelFn(x, v, t){ return currentCase().accel(x, v, t); }
function initX(){ return currentCase().initX(); }

function yScale(){
  const c = currentCase();
  if (c.yScale) return c.yScale;
  if (c.yUnitDeg) return 180/PI;
  return 1;
}
function vScale(){
  const c = currentCase();
  if (c.caseId === 'lc') return 1000;
  return 1;
}
function yUnit(){ return currentCase().xUnit; }
function vUnit(){ return currentCase().vUnit; }

function graphAmp(){
  const c = currentCase();
  if (c.caseId === 'forced'){
    const w0 = Math.sqrt(state.k/state.m), wd = state.omega_d;
    const denom = Math.sqrt(Math.pow(w0*w0-wd*wd,2) + Math.pow(state.b*wd,2));
    return Math.max((state.F0/state.m)/Math.max(denom,0.001), 0.03);
  }
  return Math.abs(initX());
}
function graphAmpV(){
  const c = currentCase();
  if (c.caseId === 'forced'){
    const w0 = Math.sqrt(state.k/state.m), wd = state.omega_d;
    const denom = Math.sqrt(Math.pow(w0*w0-wd*wd,2) + Math.pow(state.b*wd,2));
    return Math.max((state.F0/state.m)/Math.max(denom,0.001)*wd, 0.05);
  }
  return graphAmp() * omega0();
}
function graphAmpA(){ return graphAmpV() * omega0(); }

function refEnergy(){
  const c = currentCase();
  if (c.caseId === 'pendulum') return state.m*state.g*state.L*(1-Math.cos(state.theta0));
  if (c.caseId === 'physical-pendulum') return state.m*state.g*(state.Lp/2)*(1-Math.cos(state.theta0p));
  if (c.caseId === 'torsional') return 0.5*state.kappa*state.theta0t*state.theta0t;
  if (c.caseId === 'spring-h' || c.caseId === 'spring-v') return 0.5*state.k*state.A*state.A;
  if (c.caseId === 'spring-double') return 0.5*(2*state.k)*state.A*state.A;
  if (c.caseId === 'utube') return 0.5*(2*state.g/state.L)*state.A*state.A;
  if (c.caseId === 'floating') return 0.5*(state.g/state.h0c)*state.A*state.A;
  if (c.caseId === 'lc') return 0.5*state.Q0*state.Q0/state.Cc;
  if (c.caseId === 'forced'){
    const w0 = Math.sqrt(state.k/state.m), wd = state.omega_d;
    const denom = Math.sqrt(Math.pow(w0*w0-wd*wd,2) + Math.pow(state.b*wd,2));
    const Ast = (state.F0/state.m)/Math.max(denom,0.001);
    return Math.max(0.5*state.k*Ast*Ast, 0.001);
  }
  return 1;
}

function energyFractionsAt(x, v){
  const c = currentCase();
  const Etot = refEnergy();
  if (Etot <= 1e-12) return {keF:0, peF:0, totF:0};
  let pe, ke;
  if (c.caseId === 'pendulum'){
    pe = state.m*state.g*state.L*(1-Math.cos(x));
    ke = 0.5*state.m*state.L*state.L*v*v;
  } else if (c.caseId === 'physical-pendulum'){
    pe = state.m*state.g*(state.Lp/2)*(1-Math.cos(x));
    ke = 0.5*state.m*(state.Lp*state.Lp/3)*v*v;
  } else if (c.caseId === 'torsional'){
    pe = 0.5*state.kappa*x*x;
    ke = 0.5*state.I*v*v;
  } else if (c.caseId === 'spring-double'){
    pe = state.k*x*x;
    ke = 0.5*state.m*v*v;
  } else if (c.caseId === 'utube'){
    const w0sq = 2*state.g/state.L;
    pe = 0.5*w0sq*x*x;
    ke = 0.5*v*v;
  } else if (c.caseId === 'floating'){
    pe = 0.5*(state.g/state.h0c)*x*x;
    ke = 0.5*v*v;
  } else if (c.caseId === 'lc'){
    pe = 0.5*x*x/state.Cc;
    ke = 0.5*state.Lc*v*v;
  } else {
    pe = 0.5*state.k*x*x;
    ke = 0.5*state.m*v*v;
  }
  return { keF:ke/Etot, peF:pe/Etot, totF:(ke+pe)/Etot };
}

const H_STEP = 0.001;
function rk4Step(h){
  const x=state.x, v=state.v, t=state.t;
  const k1x=v, k1v=accelFn(x,v,t);
  const k2x=v+0.5*h*k1v, k2v=accelFn(x+0.5*h*k1x, v+0.5*h*k1v, t+0.5*h);
  const k3x=v+0.5*h*k2v, k3v=accelFn(x+0.5*h*k2x, v+0.5*h*k2v, t+0.5*h);
  const k4x=v+h*k3v, k4v=accelFn(x+h*k3x, v+h*k3v, t+h);
  const prevX = state.x;
  state.x += (h/6)*(k1x+2*k2x+2*k3x+k4x);
  state.v += (h/6)*(k1v+2*k2v+2*k3v+k4v);
  state.t += h;
  state.phi += omega0()*h;
  while (state.phi >= TWO_PI) state.phi -= TWO_PI;
  if (prevX < 0 && state.x >= 0){
    if (state.lastCrossT !== null) state.measuredT = state.t - state.lastCrossT;
    state.lastCrossT = state.t;
  }
}

function drawSpring(x0,y0,x1,y1,coils,radius){
  const dx=x1-x0, dy=y1-y0, len=Math.hypot(dx,dy);
  if (len < 10) return;
  const angle=Math.atan2(dy,dx);
  ctx.save(); ctx.translate(x0,y0); ctx.rotate(angle);
  const steps=coils*16, path=[];
  for (let i=0;i<=steps;i++){
    const t=i/steps;
    path.push({x:t*len, y:Math.sin(t*TWO_PI*coils)*radius});
  }
  ctx.beginPath(); path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y+1):ctx.lineTo(p.x,p.y+1));
  ctx.strokeStyle='rgba(100,116,139,0.30)'; ctx.lineWidth=3.6; ctx.stroke();
  ctx.beginPath(); path.forEach((p,i)=> i===0?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y));
  ctx.strokeStyle='#2c3e50'; ctx.lineWidth=3; ctx.stroke();
  ctx.restore();
}

      drawArrow(ctx, xC-90, yMass, xC-90, yMass + vdir*vlen, '#0a7d2b', 'v');
    }
  }
}

}

function renderPendulum(){
  drawGridPaper();
  const PX=SIM_VW/2, PY=80, Lv=140+state.L*70, br=14+state.m*10, th=state.x;
  const bx=PX+Lv*Math.sin(th), by=PY+Lv*Math.cos(th);

  ctx.fillStyle='#2c3e50'; ctx.fillRect(PX-120,PY-16,240,8);
  ctx.strokeStyle='#2c3e50'; ctx.lineWidth=1.6;
  for (let i=-120;i<=120;i+=14){
    ctx.beginPath(); ctx.moveTo(PX+i,PY-16); ctx.lineTo(PX+i-9,PY-26); ctx.stroke();
  }
  const t0=Math.abs(state.theta0);
  if (t0>0.01){
    ctx.save(); ctx.beginPath();
    ctx.arc(PX,PY,Lv,PI/2-t0,PI/2+t0,false);
    ctx.strokeStyle='#c8c8c8'; ctx.lineWidth=1.2; ctx.setLineDash([4,5]); ctx.stroke();
    ctx.restore();
  }
  ctx.save(); ctx.setLineDash([7,6]); ctx.strokeStyle='#666'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(PX,PY); ctx.lineTo(PX,PY+Lv+30); ctx.stroke(); ctx.restore();

  ctx.beginPath(); ctx.moveTo(PX,PY); ctx.lineTo(bx,by);
  ctx.strokeStyle='#111'; ctx.lineWidth=2; ctx.stroke();

  ctx.beginPath(); ctx.arc(PX,PY,7,0,TWO_PI); ctx.fillStyle='#111'; ctx.fill();
  ctx.beginPath(); ctx.arc(PX,PY,3,0,TWO_PI); ctx.fillStyle='#aaa'; ctx.fill();

  const grad=ctx.createRadialGradient(bx-br*0.35,by-br*0.35,br*0.12,bx,by,br);
  grad.addColorStop(0,'#fff'); grad.addColorStop(0.35,'#cbd5e1');
  grad.addColorStop(0.75,'#64748b'); grad.addColorStop(1,'#1e293b');
  ctx.beginPath(); ctx.arc(bx,by,br,0,TWO_PI); ctx.fillStyle=grad; ctx.fill();
  ctx.strokeStyle='#000'; ctx.lineWidth=1.6; ctx.stroke();
  ctx.beginPath(); ctx.arc(bx-br*0.32,by-br*0.32,br*0.22,0,TWO_PI);
  ctx.fillStyle='rgba(255,255,255,0.9)'; ctx.fill();

  if (Math.abs(th)>0.008){
    const arcR=60;
    ctx.save(); ctx.beginPath();
    ctx.arc(PX,PY,arcR,PI/2-th,PI/2,th>0);
    ctx.strokeStyle='#1d4ed8'; ctx.lineWidth=2; ctx.stroke(); ctx.restore();
    const midAng=PI/2-th/2;
    ctx.fillStyle='#1d4ed8'; ctx.font='bold italic 22px '+FONT;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('θ', PX+(arcR+22)*Math.cos(midAng), PY+(arcR+22)*Math.sin(midAng));
  }

  if (showVectors){
    if (Math.abs(th) > 0.008){
      const tangX = Math.cos(th), tangY = -Math.sin(th);
      const Fdir = -Math.sign(th);
      const Fmag = Math.min(Math.abs(th) * 300, 110);
      drawArrow(ctx, bx, by, bx + Fdir*tangX*Fmag, by + Fdir*tangY*Fmag, '#dc2626', 'F');
    }
    if (state.running && Math.abs(state.v) * state.L > 0.005){
      const tangX = Math.cos(th), tangY = -Math.sin(th);
      const vdir = Math.sign(state.v);
      const vlen = Math.min(Math.abs(state.v) * state.L * 90, 100);
      drawArrow(ctx, bx, by, bx + vdir*tangX*vlen, by + vdir*tangY*vlen, '#0a7d2b', 'v');
    }
  }
}

function renderPhysicalPendulum(){

  ctx.save(); ctx.translate(PX,PY); ctx.rotate(th);

  }

  if (showVectors){
    if (Math.abs(th) > 0.008){
      const tangX = Math.cos(th), tangY = -Math.sin(th);
      const Fdir = -Math.sign(th);
      const Fmag = Math.min(Math.abs(th) * 200, 100);
      drawArrow(ctx, cmx, cmy, cmx + Fdir*tangX*Fmag, cmy + Fdir*tangY*Fmag, '#dc2626', 'F');

      const vlen = Math.min(Math.abs(state.v) * 60, 90);
      drawArrow(ctx, cmx, cmy, cmx + vdir*tangX*vlen, cmy + vdir*tangY*vlen, '#0a7d2b', 'v');
    }
  }
}

function renderUtube(){
  drawGridPaper();

  const topY = 55;
  const bendTopY = 340;

  const innerL = 175;
  const armW   = 52;
  const gapW   = 60;
  const armInnerL = innerL + armW;
  const armInnerR = armInnerL + gapW;
  const innerR    = armInnerR + armW;
  const bendCx    = (innerL + innerR) / 2;
  const innerRad  = (innerR - innerL) / 2;

  const wallW  = 10;
  const outerL = innerL - wallW;
  const outerR = innerR + wallW;
  const outerRad = innerRad + wallW;

  const innerBottomY = bendTopY + innerRad;

  const yEq  = 190;
  const vPx  = 600;
  const yL   = yEq - state.x * vPx;
  const yR   = yEq + state.x * vPx;

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(innerL, topY);
  ctx.lineTo(innerL, bendTopY);
  ctx.arc(bendCx, bendTopY, innerRad, PI, 0, true);
  ctx.lineTo(innerR, topY);
  ctx.closePath();
  ctx.clip();

  const lg = ctx.createLinearGradient(0, yEq - 40, 0, innerBottomY);
  lg.addColorStop(0.00, '#8ecbf0');
  lg.addColorStop(0.35, '#4095cb');
  lg.addColorStop(0.70, '#1d6ba0');
  lg.addColorStop(1.00, '#0d3554');
  ctx.fillStyle = lg;
  ctx.fillRect(0, 0, SIM_VW, SIM_VH);

  ctx.fillStyle = '#eaf3f9';
  ctx.fillRect(innerL - 2, topY - 2, armW + 4, yL - topY + 4);
  ctx.fillRect(innerR - armW - 2, topY - 2, armW + 4, yR - topY + 4);

  ctx.fillStyle = '#fdfcf6';
  ctx.fillRect(armInnerL, topY, armInnerR - armInnerL, bendTopY - topY);

  const sL = ctx.createLinearGradient(innerL, 0, innerL + armW, 0);
  sL.addColorStop(0, 'rgba(0,0,0,0.22)');
  sL.addColorStop(0.5, 'rgba(255,255,255,0.10)');
  sL.addColorStop(1, 'rgba(0,0,0,0.05)');
  ctx.fillStyle = sL;
  ctx.fillRect(innerL, yL, armW, innerBottomY - yL);

  const sR = ctx.createLinearGradient(armInnerR, 0, innerR, 0);
  sR.addColorStop(0, 'rgba(0,0,0,0.05)');
  sR.addColorStop(0.5, 'rgba(255,255,255,0.10)');
  sR.addColorStop(1, 'rgba(0,0,0,0.22)');
  ctx.fillStyle = sR;
  ctx.fillRect(armInnerR, yR, armW, innerBottomY - yR);

  ctx.beginPath();
  ctx.moveTo(innerL, yL);
  ctx.quadraticCurveTo(innerL + armW/2, yL + 5, innerL + armW, yL);
  ctx.lineTo(innerL + armW, yL + 8);
  ctx.quadraticCurveTo(innerL + armW/2, yL + 13, innerL, yL + 8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(innerL, yL);
  ctx.quadraticCurveTo(innerL + armW/2, yL + 5, innerL + armW, yL);
  ctx.strokeStyle = '#e6f4ff'; ctx.lineWidth = 2.6; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(armInnerR, yR);
  ctx.quadraticCurveTo(armInnerR + armW/2, yR + 5, innerR, yR);
  ctx.lineTo(innerR, yR + 8);
  ctx.quadraticCurveTo(armInnerR + armW/2, yR + 13, armInnerR, yR + 8);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(armInnerR, yR);
  ctx.quadraticCurveTo(armInnerR + armW/2, yR + 5, innerR, yR);
  ctx.strokeStyle = '#e6f4ff'; ctx.lineWidth = 2.6; ctx.stroke();

  ctx.restore();

  ctx.strokeStyle = '#0f2537';

  ctx.beginPath();
  ctx.moveTo(outerL, topY);
  ctx.lineTo(outerL, bendTopY);
  ctx.arc(bendCx, bendTopY, outerRad, PI, 0, true);
  ctx.lineTo(outerR, topY);
  ctx.lineWidth = 2.6; ctx.stroke();

  ctx.beginPath(); ctx.moveTo(innerL, topY); ctx.lineTo(innerL, bendTopY); ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(innerR, topY); ctx.lineTo(innerR, bendTopY); ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(armInnerL, topY); ctx.lineTo(armInnerL, bendTopY); ctx.lineWidth = 2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(armInnerR, topY); ctx.lineTo(armInnerR, bendTopY); ctx.lineWidth = 2.2; ctx.stroke();

  ctx.beginPath();
  ctx.arc(bendCx, bendTopY, innerRad, PI, 0, true);
  ctx.lineWidth = 2.2; ctx.stroke();

  ctx.fillStyle = '#e8eef3';
  ctx.beginPath(); ctx.ellipse(innerL + armW/2, topY, armW/2 + 1, 5, 0, 0, TWO_PI); ctx.fill();
  ctx.strokeStyle = '#0f2537'; ctx.lineWidth = 1.6; ctx.stroke();
  ctx.beginPath(); ctx.ellipse(armInnerR + armW/2, topY, armW/2 + 1, 5, 0, 0, TWO_PI); ctx.fill();
  ctx.strokeStyle = '#0f2537'; ctx.lineWidth = 1.6; ctx.stroke();

  ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.moveTo(innerL + 6, topY + 20); ctx.lineTo(innerL + 6, bendTopY - 10); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(innerR - 6, topY + 20); ctx.lineTo(innerR - 6, bendTopY - 10); ctx.stroke();

  ctx.save();
  ctx.setLineDash([6, 5]);
  ctx.strokeStyle = '#444'; ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(outerL - 55, yEq);
  ctx.lineTo(outerR + 55, yEq);
  ctx.stroke();
  ctx.restore();

  ctx.fillStyle = '#000'; ctx.font = 'bold italic 16px ' + FONT;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.fillText('equilibrium', outerL - 62, yEq);

  if (Math.abs(state.x) > 0.0015){
    const arrowX = outerL - 25;
    const dir = Math.sign(yL - yEq) || -1;
    ctx.strokeStyle = '#dc2626'; ctx.fillStyle = '#dc2626'; ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.moveTo(arrowX, yEq);
    ctx.lineTo(arrowX, yL);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(arrowX, yEq);
    ctx.lineTo(arrowX - 6, yEq + dir*10);
    ctx.lineTo(arrowX + 6, yEq + dir*10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(arrowX, yL);
    ctx.lineTo(arrowX - 6, yL - dir*10);
    ctx.lineTo(arrowX + 6, yL - dir*10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#dc2626'; ctx.font = 'bold italic 20px ' + FONT;
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText('x', arrowX - 10, (yEq + yL) / 2);
  }

  const gX = outerR + 55;
  ctx.strokeStyle = '#111'; ctx.fillStyle = '#111'; ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(gX, 130); ctx.lineTo(gX, 205); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(gX, 205);
  ctx.lineTo(gX - 7, 194);
  ctx.lineTo(gX + 7, 194);
  ctx.closePath(); ctx.fill();
  ctx.font = 'bold italic 22px ' + FONT;
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.fillText('g', gX + 10, 192);

  if (Math.abs(state.x) > 0.0015){
    const xa = outerR + 95;
    ctx.strokeStyle = '#b91c1c'; ctx.fillStyle = '#b91c1c'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(xa, yL); ctx.lineTo(xa, yR); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(xa, yL); ctx.lineTo(xa - 6, yL + 10); ctx.lineTo(xa + 6, yL + 10);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(xa, yR); ctx.lineTo(xa - 6, yR - 10); ctx.lineTo(xa + 6, yR - 10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#000'; ctx.font = 'bold italic 16px ' + FONT;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('2x', xa + 10, (yL + yR) / 2);
  }
}

  ctx.moveTo(beakerL+8, beakerTop+20); ctx.lineTo(beakerL+8, beakerBot-20); ctx.stroke();

  if (showVectors && Math.abs(state.x) > 0.003){

    drawArrow(ctx, beakerR+70, cylTop, beakerR+70, cylTop + Fdir*Fmag, '#dc2626', 'F');
  }
}

function drawReferenceCircle(){
  cctx.fillStyle='#fdfcf6'; cctx.fillRect(0,0,CIR_VW,CIR_VH);
  const cx=CIR_VW/2, cy=CIR_VH/2+6, R=165;

  cctx.beginPath(); cctx.arc(cx,cy,R,0,TWO_PI);
  cctx.strokeStyle='#000'; cctx.lineWidth=2; cctx.stroke();

  cctx.save(); cctx.strokeStyle='#ededed'; cctx.lineWidth=1;
  for (let k=1;k<8;k++){
    const a=k*PI/4;
    cctx.beginPath();
    cctx.moveTo(cx+18*Math.cos(a),cy-18*Math.sin(a));
    cctx.lineTo(cx+(R-6)*Math.cos(a),cy-(R-6)*Math.sin(a));
    cctx.stroke();
  }
  cctx.restore();

  cctx.strokeStyle='#aaa'; cctx.lineWidth=1.2;
  cctx.beginPath(); cctx.moveTo(cx-R-40,cy); cctx.lineTo(cx+R+40,cy); cctx.stroke();
  cctx.beginPath(); cctx.moveTo(cx,cy-R-20); cctx.lineTo(cx,cy+R+20); cctx.stroke();

  cctx.fillStyle='#000'; cctx.font='bold italic 18px '+FONT;
  cctx.textAlign='center'; cctx.textBaseline='middle';
  const lr=R+24;
  [{d:0,a:0},{d:90,a:PI/2},{d:180,a:PI},{d:270,a:-PI/2}].forEach(L=>{
    cctx.fillText(L.d+'°', cx+lr*Math.cos(L.a), cy-lr*Math.sin(L.a));
  });
  cctx.beginPath(); cctx.arc(cx,cy,4,0,TWO_PI); cctx.fillStyle='#000'; cctx.fill();

  const phi=state.phi, arcR=52;
  if (phi>0.012){
    cctx.beginPath(); cctx.arc(cx,cy,arcR,0,-phi,true);
    cctx.strokeStyle='#1d4ed8'; cctx.lineWidth=2.4; cctx.stroke();
  }
  if (phi>0.15){
    const bis=phi/2;
    cctx.fillStyle='#1d4ed8'; cctx.font='bold italic 24px '+FONT;
    cctx.textAlign='center'; cctx.textBaseline='middle';
    cctx.fillText('φ', cx+(arcR+22)*Math.cos(bis), cy-(arcR+22)*Math.sin(bis));
  }

  const px=cx+R*Math.cos(phi), py=cy-R*Math.sin(phi);
  cctx.beginPath(); cctx.moveTo(cx,cy); cctx.lineTo(px,py);
  cctx.strokeStyle='#1d4ed8'; cctx.lineWidth=2.2; cctx.stroke();

  cctx.save(); cctx.setLineDash([6,5]);
  cctx.beginPath(); cctx.moveTo(px,py); cctx.lineTo(px,cy);
  cctx.strokeStyle='#666'; cctx.lineWidth=1.4; cctx.stroke(); cctx.restore();

  cctx.beginPath(); cctx.arc(px,py,9,0,TWO_PI);
  cctx.fillStyle='#1d4ed8'; cctx.fill();
  cctx.strokeStyle='#fff'; cctx.lineWidth=2.4; cctx.stroke();
  cctx.fillStyle='#1d4ed8'; cctx.font='bold italic 22px '+FONT;
  cctx.textAlign='center'; cctx.textBaseline='middle';
  cctx.fillText('P', px+26*Math.cos(phi+0.32), py-26*Math.sin(phi+0.32));

  const qx=cx+R*Math.cos(phi);
  cctx.beginPath(); cctx.arc(qx,cy,8,0,TWO_PI);
  cctx.fillStyle='#b91c1c'; cctx.fill();
  cctx.strokeStyle='#fff'; cctx.lineWidth=2.4; cctx.stroke();
  cctx.fillStyle='#b91c1c'; cctx.font='bold italic 20px '+FONT;
  cctx.textBaseline='top';
  cctx.fillText('Q', qx, cy+16);

  const sym = (state.caseId==='lc')?'q':(currentCase().yUnitDeg?'θ':'x');
  cctx.fillStyle='#000'; cctx.font='bold italic 18px '+FONT;
  cctx.textAlign='left'; cctx.textBaseline='top';
  cctx.fillText('φ = '+(phi*180/PI).toFixed(0)+'°', 14, 14);
  cctx.fillText(sym+' = '+(state.x*yScale()).toFixed(2)+' '+yUnit(), 14, 38);
}

const GPAD = { l: 58, r: 14, t: 32, b: 42 };
const G_WINDOW = 8;

function fmtYAxis(v){
  const a = Math.abs(v);
  const sign = v<0 ? '−' : '+';
  if (a >= 100) return sign + a.toFixed(0);
  if (a >= 10)  return sign + a.toFixed(1);
  return sign + a.toFixed(2);
}

function prepareGraph(g, vw, vh, yMax, unitY, yTitle, title){
  g.fillStyle='#fff'; g.fillRect(0,0,vw,vh);

  g.fillStyle='#000'; g.font='bold italic 14px '+FONT;
  g.textAlign='center'; g.textBaseline='top';
  g.fillText(title, vw/2, 8);

  const plotW = vw - GPAD.l - GPAD.r;
  const plotH = vh - GPAD.t - GPAD.b;
  const tNow = Math.max(state.t, G_WINDOW);
  const tMin = tNow - G_WINDOW, tMax = tNow;
  const gx = t => GPAD.l + (t-tMin)/(tMax-tMin)*plotW;
  const gy = v => GPAD.t + (yMax-v)/(2*yMax)*plotH;

  g.strokeStyle='#e8e8e8'; g.lineWidth=1;
  for (let i=0;i<=8;i++){
    const y=Math.round(GPAD.t+i*plotH/8)+0.5;
    g.beginPath(); g.moveTo(GPAD.l,y); g.lineTo(GPAD.l+plotW,y); g.stroke();
  }
  for (let i=0;i<=8;i++){
    const x=Math.round(GPAD.l+i*plotW/8)+0.5;
    g.beginPath(); g.moveTo(x,GPAD.t); g.lineTo(x,GPAD.t+plotH); g.stroke();
  }

  const y0=Math.round(gy(0))+0.5;
  g.strokeStyle='#000'; g.lineWidth=1.6;
  g.beginPath(); g.moveTo(GPAD.l+0.5,GPAD.t); g.lineTo(GPAD.l+0.5,GPAD.t+plotH); g.stroke();
  g.beginPath(); g.moveTo(GPAD.l,y0); g.lineTo(GPAD.l+plotW,y0); g.stroke();

  g.fillStyle='#000'; g.font='bold 15px '+FONT;
  g.textAlign='right'; g.textBaseline='middle';
  g.fillText(fmtYAxis(yMax), GPAD.l-8, gy(yMax));
  g.fillText('0', GPAD.l-8, gy(0));
  g.fillText(fmtYAxis(-yMax), GPAD.l-8, gy(-yMax));

  g.save();
  g.translate(15, GPAD.t + plotH/2);
  g.rotate(-PI/2);
  g.textAlign='center'; g.textBaseline='middle';
  g.fillStyle='#000'; g.font='bold italic 14px '+FONT;
  g.fillText(yTitle, 0, 0);
  g.restore();

  g.fillStyle='#000'; g.font='bold 14px '+FONT;
  g.textAlign='center'; g.textBaseline='top';
  for (let i=0;i<=8;i++){
    const t = tMin + (tMax-tMin)*i/8;
    g.fillText(t.toFixed(1), GPAD.l+plotW*i/8, GPAD.t+plotH+6);
  }
  g.font='bold italic 14px '+FONT;
  g.textBaseline='alphabetic';
  g.fillText('Time / s', GPAD.l+plotW/2, vh-6);

  return {gx, gy, plotW, plotH, tMin, tMax};
}

function drawDispGraph(){

  else if (id==='lc')    yTitle='Charge / mC';
  else                   yTitle='Displacement / m';

  const {gx,gy,tMin}=prepareGraph(dctx, GR_VW, GR_VH, yMax, currentCase().xUnit, yTitle, 'Displacement – time');

  if (state.history.length>1){
    dctx.beginPath();
    let started=false;
    for (const p of state.history){
      if (p.t<tMin) continue;
      const px=gx(p.t), py=gy(p.x*scale);
      if (!started){dctx.moveTo(px,py);started=true;} else dctx.lineTo(px,py);
    }
    dctx.strokeStyle='#1d4ed8'; dctx.lineWidth=2; dctx.stroke();
  }
  if (state.history.length>0){
    const px=gx(state.t), py=gy(state.x*scale);

      dctx.fillStyle='#1d4ed8'; dctx.beginPath(); dctx.arc(px,py,3.5,0,TWO_PI); dctx.fill();
    }
  }
}

/* ============================================================
   ENERGY GRAPH — Cambridge-style analytic curves
   Smooth sin²/cos² curves drawn from t = 0 up to the current
   simulation time. Before Release (state.t = 0), nothing is
   drawn. Once you press Release, the curves begin to trace out
   from the left, growing as the oscillation progresses, exactly
   like the reference textbook figure. Once the 8-second window
   fills, the graph scrolls in sync with the other three plots.
   ============================================================ */
function drawEnergyGraph(){
  ectx.fillStyle = '#fff';
  ectx.fillRect(0, 0, GR_VW, GR_VH);

  const plotW = GR_VW - GPAD.l - GPAD.r;
  const plotH = GR_VH - GPAD.t - GPAD.b - 18;
  const yMax = 1.10;

  const tNow = Math.max(state.t, G_WINDOW);
  const tMin = tNow - G_WINDOW;
  const tMax = tNow;
  const gx = t => GPAD.l + (t - tMin) / G_WINDOW * plotW;
  const gy = v => GPAD.t + (yMax - v) / yMax * plotH;

  /* horizontal grid */
  ectx.strokeStyle = '#ececec';
  ectx.lineWidth = 1;
  for (let i = 0; i <= 4; i++){
    const y = Math.round(GPAD.t + i*plotH/4) + 0.5;
    ectx.beginPath();
    ectx.moveTo(GPAD.l, y);
    ectx.lineTo(GPAD.l + plotW, y);
    ectx.stroke();
  }

  /* vertical dashed T/4 guides */
  const w0 = omega0();
  const T = TWO_PI / w0;
  const damping = state.b || 0;
  const quarterStep = T / 4;
  ectx.save();
  ectx.setLineDash([4, 4]);
  ectx.strokeStyle = '#c8c8c8';
  ectx.lineWidth = 1;
  const firstQ = Math.ceil(tMin / quarterStep) * quarterStep;
  for (let tq = firstQ; tq <= tMax + 1e-9; tq += quarterStep){
    const x = Math.round(gx(tq)) + 0.5;
    if (x < GPAD.l - 1 || x > GPAD.l + plotW + 1) continue;
    ectx.beginPath();
    ectx.moveTo(x, GPAD.t);
    ectx.lineTo(x, GPAD.t + plotH);
    ectx.stroke();
  }
  ectx.restore();

  /* axes */
  const y0 = Math.round(gy(0)) + 0.5;
  ectx.strokeStyle = '#000';
  ectx.lineWidth = 1.6;
  ectx.beginPath();
  ectx.moveTo(GPAD.l + 0.5, GPAD.t);
  ectx.lineTo(GPAD.l + 0.5, GPAD.t + plotH);
  ectx.stroke();
  ectx.beginPath();
  ectx.moveTo(GPAD.l, y0);
  ectx.lineTo(GPAD.l + plotW, y0);
  ectx.stroke();

  /* y-axis labels */
  ectx.fillStyle = '#000';
  ectx.font = 'bold 15px ' + FONT;
  ectx.textAlign = 'right';
  ectx.textBaseline = 'middle';
  ectx.fillText('½kA²', GPAD.l - 8, gy(1));
  ectx.fillText('0', GPAD.l - 8, gy(0));

  /* y-axis title */
  ectx.save();
  ectx.translate(14, GPAD.t + plotH/2);
  ectx.rotate(-PI/2);
  ectx.textAlign = 'center';
  ectx.textBaseline = 'middle';
  ectx.fillStyle = '#000';
  ectx.font = 'bold italic 15px ' + FONT;
  ectx.fillText('Energy (J)', 0, 0);
  ectx.restore();

  /* x-axis labels */
  ectx.fillStyle = '#000';
  ectx.font = 'bold 12px ' + FONT;
  ectx.textAlign = 'center';
  ectx.textBaseline = 'top';
  for (let tq = firstQ; tq <= tMax + 1e-9; tq += quarterStep){
    const x = gx(tq);
    if (x < GPAD.l - 4 || x > GPAD.l + plotW + 4) continue;
    const k = Math.round(tq / quarterStep);
    let label;
    if (k === 0) label = '0';
    else if (k % 4 === 0) label = (k/4) + 'T';
    else if (k % 4 === 1) label = '¼T';
    else if (k % 4 === 2) label = '½T';
    else label = '¾T';
    ectx.fillText(label, x, GPAD.t + plotH + 5);
  }
  ectx.font = 'bold italic 14px ' + FONT;
  ectx.textBaseline = 'alphabetic';
  ectx.fillText('Time (s)', GPAD.l + plotW/2, GR_VH - 6);

  const COL_TOT = '#26a69a';
  const COL_K   = '#e53935';
  const COL_U   = '#1a5fb4';

  /* ---- Analytic sin²/cos² curves ----
     Drawn only from t = 0 up to the current simulation time.
     Before Release, state.t = 0 so nothing is drawn.
     After Release, curves grow smoothly from the left. */
  const drawStart = Math.max(tMin, 0);
  const drawEnd   = Math.min(tMax, state.t);

  if (drawEnd > drawStart + 1e-9){
    const N = 500;
    const env = t => Math.exp(-damping * t);

    /* Kinetic energy K(t) = E · sin²(ωt) — red */
    ectx.beginPath();
    let started = false;
    for (let i = 0; i <= N; i++){
      const t = drawStart + (drawEnd - drawStart) * i / N;
      if (t < 0) continue;
      const s = Math.sin(w0 * t);
      const v = Math.min(env(t) * s * s, yMax);
      const px = gx(t), py = gy(v);
      if (!started){ ectx.moveTo(px, py); started = true; }
      else ectx.lineTo(px, py);
    }
    ectx.strokeStyle = COL_K;
    ectx.lineWidth = 2.2;
    ectx.stroke();

    /* Potential energy U(t) = E · cos²(ωt) — blue */
    ectx.beginPath();
    started = false;
    for (let i = 0; i <= N; i++){
      const t = drawStart + (drawEnd - drawStart) * i / N;
      if (t < 0) continue;
      const c = Math.cos(w0 * t);
      const v = Math.min(env(t) * c * c, yMax);
      const px = gx(t), py = gy(v);
      if (!started){ ectx.moveTo(px, py); started = true; }
      else ectx.lineTo(px, py);
    }
    ectx.strokeStyle = COL_U;
    ectx.lineWidth = 2.2;
    ectx.stroke();

    /* Total energy E(t) — teal */
    ectx.beginPath();
    started = false;
    for (let i = 0; i <= N; i++){
      const t = drawStart + (drawEnd - drawStart) * i / N;
      if (t < 0) continue;
      const v = Math.min(env(t), yMax);
      const px = gx(t), py = gy(v);
      if (!started){ ectx.moveTo(px, py); started = true; }
      else ectx.lineTo(px, py);
    }
    ectx.strokeStyle = COL_TOT;
    ectx.lineWidth = 2.4;
    ectx.stroke();
  }

  /* live phase marker — three dots at current time */
  if (state.running && state.t > 0){
    const px = gx(state.t);
    if (px >= GPAD.l && px <= GPAD.l + plotW){
      const t = state.t;
      const env = Math.exp(-damping * t);
      const kVal = Math.min(env * Math.pow(Math.sin(w0*t), 2), yMax);
      const uVal = Math.min(env * Math.pow(Math.cos(w0*t), 2), yMax);
      const eVal = Math.min(env, yMax);

      const putDot = (v, color) => {
        const py = gy(v);
        ectx.fillStyle = '#fff';
        ectx.beginPath(); ectx.arc(px, py, 5, 0, TWO_PI); ectx.fill();
        ectx.fillStyle = color;
        ectx.beginPath(); ectx.arc(px, py, 3.2, 0, TWO_PI); ectx.fill();
      };
      putDot(eVal, COL_TOT);
      putDot(uVal, COL_U);
      putDot(kVal, COL_K);
    }
  }

  /* curve labels on right edge */
  ectx.font = 'bold italic 14px ' + FONT;
  ectx.textAlign = 'left';
  ectx.textBaseline = 'middle';
  ectx.fillStyle = COL_TOT;
  ectx.fillText('E_total', GR_VW - 58, gy(1) - 12);
  ectx.fillStyle = COL_U;
  ectx.fillText('U', GR_VW - 14, gy(0.62));
  ectx.fillStyle = COL_K;
  ectx.fillText('K', GR_VW - 14, gy(0.32));

  /* legend */
  const lY = GR_VH - 10;
  let lX = GPAD.l;

  ectx.strokeStyle = COL_TOT;
  ectx.lineWidth = 3;
  ectx.beginPath(); ectx.moveTo(lX, lY); ectx.lineTo(lX + 22, lY); ectx.stroke();
  ectx.fillStyle = '#000';
  ectx.font = 'bold italic 13px ' + FONT;
  ectx.textAlign = 'left';
  ectx.textBaseline = 'middle';
  ectx.fillText('E_total', lX + 26, lY);

  lX += 92;
  ectx.strokeStyle = COL_K;
  ectx.lineWidth = 3;
  ectx.beginPath(); ectx.moveTo(lX, lY); ectx.lineTo(lX + 22, lY); ectx.stroke();
  ectx.fillStyle = '#000';
  ectx.fillText('K = ½mv²', lX + 26, lY);

  lX += 110;
  ectx.strokeStyle = COL_U;
  ectx.lineWidth = 3;
  ectx.beginPath(); ectx.moveTo(lX, lY); ectx.lineTo(lX + 22, lY); ectx.stroke();
  ectx.fillStyle = '#000';
  ectx.fillText('U = ½kx²', lX + 26, lY);
}

const paramList = document.getElementById('paramList');

function buildParams(){
  paramList.innerHTML='';
  const c = currentCase();
  c.params.forEach(p=>{
    const wrap = document.createElement('div');
    wrap.className='param';
    const hasScale = !!p.scale;
    const val = hasScale ? state[p.key]/p.scale : state[p.key];
    const symHtml = p.sub ? p.sym+'<sub>'+p.sub+'</sub>' : p.sym;

    wrap.innerHTML =
      '<div class="param-row">'+
        '<span class="name">'+p.label+' <i>'+symHtml+'</i></span>'+
        '<span class="value" id="val_'+p.key+'">'+val.toFixed(p.dec)+' '+p.unit+'</span>'+
      '</div>'+
      '<input type="range" id="sld_'+p.key+'" min="'+p.min+'" max="'+p.max+
      '" step="'+p.step+'" value="'+val+'">';

    paramList.appendChild(wrap);
    const sld = wrap.querySelector('input');
    sld.addEventListener('input', e=>{
      const v = parseFloat(e.target.value);
      if (hasScale) state[p.key] = v*p.scale;
      else state[p.key] = v;
      document.getElementById('val_'+p.key).textContent = v.toFixed(p.dec)+' '+p.unit;
      if (p.key !== 'b' && p.key !== 'Rc') restartMotion();
    });
  });
}

function updateParamSlider(key, value){
  const slider = document.getElementById('sld_'+key);
  if (!slider) return;
  const p = currentCase().params.find(pp=>pp.key===key);
  if (!p) return;
  slider.value = value;
  const valEl = document.getElementById('val_'+key);
  if (valEl) valEl.textContent = value.toFixed(p.dec)+' '+p.unit;
}

function fmt(v,d){
  const s=Math.abs(v).toFixed(d);
  return (v<0?'−':'')+s;
}

const readX=document.getElementById('readX');
const readPhi=document.getElementById('readPhi');
const readV=document.getElementById('readV');
const readA=document.getElementById('readA');
const readT=document.getElementById('readT');
const readTth=document.getElementById('readTth');
const readTmeas=document.getElementById('readTmeas');
const readEtotal=document.getElementById('readEtotal');
const barKE=document.getElementById('barKE');
const barPE=document.getElementById('barPE');
const barTE=document.getElementById('barTE');
const valKE=document.getElementById('valKE');
const valPE=document.getElementById('valPE');
const valTE=document.getElementById('valTE');

function updateReadouts(){
  const c = currentCase();
  const w0 = omega0(), Tth = TWO_PI/w0;
  const scale = yScale(), vsc = vScale();

  readX.innerHTML = fmt(state.x*scale, 2) + '<span class="u">'+c.xUnit+'</span>';
  readPhi.innerHTML = (state.phi*180/PI).toFixed(0)+'<span class="u">&deg;</span>';
  readV.innerHTML = fmt(state.v*vsc, 3) + '<span class="u">'+c.vUnit+'</span>';
  readA.innerHTML = fmt(accelFn(state.x, state.v, state.t)*vsc, 3) + '<span class="u">'+c.aUnit+'</span>';
  readT.innerHTML = fmt(state.t, 2) + '<span class="u">s</span>';
  readTth.innerHTML = Tth.toFixed(3) + '<span class="u">s</span>';
  readTmeas.innerHTML = state.measuredT ? state.measuredT.toFixed(3)+'<span class="u">s</span>' : '&mdash;';

  const fr = energyFractionsAt(state.x, state.v);
  const keF = Math.max(0, Math.min(fr.keF, 1));
  const peF = Math.max(0, Math.min(fr.peF, 1));
  const tF  = Math.max(0, Math.min(fr.totF, 1));

  barKE.style.width = (keF*100).toFixed(1)+'%';
  barPE.style.width = (peF*100).toFixed(1)+'%';
  barTE.style.width = (tF*100).toFixed(1)+'%';
  valKE.textContent = (keF*100).toFixed(0)+'%';
  valPE.textContent = (peF*100).toFixed(0)+'%';
  valTE.textContent = (tF*100).toFixed(0)+'%';

  const Efn = c.energyFormula;
  if (Efn){
    const E = Efn();
    let eStr;
    if (Math.abs(E)<1e-3)   eStr = (E*1e6).toFixed(2)+' µJ';
    else if (Math.abs(E)<1) eStr = (E*1e3).toFixed(2)+' mJ';
    else                    eStr = E.toFixed(3)+' J';
    readEtotal.innerHTML = '<b>'+eStr+'</b>';
  } else {
    readEtotal.innerHTML = '<b>100 %</b>';
  }
}

const caseTabs = document.getElementById('caseTabs');

function buildTabs(){
  caseTabs.innerHTML='';
  CASE_ORDER.forEach(id=>{
    const b = document.createElement('button');
    b.className = 'case-tab' + (id===state.caseId?' active':'');
    b.dataset.id = id;
    b.textContent = CASES[id].label;
    b.addEventListener('click', ()=>switchCase(id));
    caseTabs.appendChild(b);
  });
}

function restartMotion(){
  state.x = initX(); state.v = 0; state.t = 0; state.phi = 0;
  state.history = []; resetMeasurement();
}

function switchCase(id){
  state.caseId = id;
  document.querySelectorAll('.case-tab').forEach(b=>{
    b.classList.toggle('active', b.dataset.id===id);
  });
  const c = CASES[id];
  document.getElementById('formulaBlock').innerHTML = c.formula;

  buildParams();
  state.x = initX(); state.v = 0; state.t = 0; state.phi = 0;
  state.history = []; state.lastCrossT = null; state.measuredT = null;
  state.running = false;
  setStatus('', 'Ready');
}

let lastFrame = performance.now();
let accumulator = 0;

function loop(now){
  const realDt = Math.min((now-lastFrame)/1000, 0.05);
  lastFrame = now;

  if (state.running){
    accumulator += realDt;
    let guard = 0;
    while (accumulator >= H_STEP && guard < 600){
      rk4Step(H_STEP);
      accumulator -= H_STEP;
      guard++;
    }
    state.history.push({t:state.t, x:state.x, v:state.v, a:accelFn(state.x,state.v,state.t)});
    while (state.history.length>4000) state.history.shift();
    if (state.t>120) state.running = false;
  }

  syncCanvas(simCanvas,  ctx,  simPanel,  SIM_VW, SIM_VH);
  syncCanvas(circCanvas, cctx, circPanel, CIR_VW, CIR_VH);
  syncCanvas(dispCanvas, dctx, dispPanel, GR_VW,  GR_VH);
  syncCanvas(velCanvas,  vctx, velPanel,  GR_VW,  GR_VH);
  syncCanvas(accCanvas,  actx, accPanel,  GR_VW,  GR_VH);
  syncCanvas(enCanvas,   ectx, enPanel,   GR_VW,  GR_VH);

  currentCase().render();
  drawReferenceCircle();
  drawDispGraph();
  drawVelGraph();
  drawAccGraph();
  drawEnergyGraph();
  updateReadouts();

  requestAnimationFrame(loop);
}

let draggingObj=false, dragCaseId=null;

function pointerVirtual(evt){
  const rect = simCanvas.getBoundingClientRect();
  return {
    x: (evt.clientX - rect.left) / rect.width  * SIM_VW,
    y: (evt.clientY - rect.top ) / rect.height * SIM_VH
  };
}

function hitHandle(v){
  const c = currentCase();
  if (c.hitTestRod) return c.hitTestRod(v) ? {x:v.x, y:v.y} : null;
  if (!c.getHandle) return null;
  const h = c.getHandle();
  const dx = v.x - h.x, dy = v.y - h.y;
  const r = h.r + 24;
  return (dx*dx + dy*dy < r*r) ? h : null;
}

function onPointerDown(e){
  const v = pointerVirtual(e);
  if (hitHandle(v)){
    draggingObj = true;
    dragCaseId = state.caseId;
    state.running = false;
    simCanvas.style.cursor = 'grabbing';
    e.preventDefault();
    window.addEventListener('pointermove', onPointerMove);
    window.addEventListener('pointerup', onPointerUp);
    window.addEventListener('pointercancel', onPointerCancel);
  }
}
function onPointerMove(e){
  if (!draggingObj) return;
  if (state.caseId !== dragCaseId) return;
  const v = pointerVirtual(e);
  const c = currentCase();
  if (c.dragTo) c.dragTo(v.x, v.y);
  state.t = 0;
  state.phi = state.x >= 0 ? 0 : PI;
  state.history = [{t:0, x:state.x, v:0, a:accelFn(state.x, 0, 0)}];
  resetMeasurement();
}
function onPointerUp(e){
  if (!draggingObj) return;
  draggingObj = false;
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerCancel);

  const c = currentCase();
  const A = Math.abs(state.x);
  if (c.ampKey){
    if (c.ampKey==='theta0')       state.theta0  = A;
    else if (c.ampKey==='theta0p') state.theta0p = A;
    else if (c.ampKey==='theta0t') state.theta0t = A;
    else if (c.ampKey==='A')       state.A       = A;
    else if (c.ampKey==='Q0')      state.Q0      = A;
  }
  state.v = 0; state.t = 0;
  state.phi = state.x >= 0 ? 0 : PI;
  state.history = [{t:0, x:state.x, v:0, a:accelFn(state.x, 0, 0)}];
  resetMeasurement();
  state.running = true;
  setStatus('running', 'Running');
  buildParams();
  simCanvas.style.cursor = 'grab';
  dragCaseId = null;
  showToast('New amplitude: ' + A.toFixed(3));
}
function onPointerCancel(){
  draggingObj = false;
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerCancel);
  simCanvas.style.cursor = 'default';
  dragCaseId = null;
}

simCanvas.addEventListener('pointerdown', onPointerDown);

simCanvas.addEventListener('pointermove', e=>{
  if (draggingObj) return;
  const v = pointerVirtual(e);
  simCanvas.style.cursor = hitHandle(v) ? 'grab' : 'default';
});

(function(){
  const win = document.getElementById('paramWin');
  const head = document.getElementById('paramHead');
  let dragging=false, offX=0, offY=0;
  head.addEventListener('pointerdown', e=>{
    dragging=true;
    const r = win.getBoundingClientRect();
    offX = e.clientX - r.left; offY = e.clientY - r.top;
    head.setPointerCapture(e.pointerId); e.preventDefault();
  });
  head.addEventListener('pointermove', e=>{
    if (!dragging) return;
    let left = e.clientX - offX, top = e.clientY - offY;
    left = Math.max(0, Math.min(window.innerWidth  - win.offsetWidth,  left));
    top  = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, top));
    win.style.left = left+'px'; win.style.top = top+'px'; win.style.right = 'auto';
  });
  head.addEventListener('pointerup', e=>{
    dragging=false;
    try { head.releasePointerCapture(e.pointerId); } catch(_){}
  });
  head.addEventListener('pointercancel', ()=>{ dragging=false; });
})();

function resetMeasurement(){ state.lastCrossT = null; state.measuredT = null; }

document.getElementById('btnRelease').addEventListener('click', ()=>{
  restartMotion();
  state.running = true; setStatus('running','Running');
  const c = currentCase();
  if (c.caseId==='pendulum') showToast('Released from θ₀ = '+(state.theta0/DEG).toFixed(1)+'°');
  else if (c.caseId==='physical-pendulum') showToast('Released from θ₀ = '+(state.theta0p/DEG).toFixed(1)+'°');
  else if (c.caseId==='torsional') showToast('Released from θ₀ = '+(state.theta0t/DEG).toFixed(1)+'°');
  else if (c.caseId==='lc') showToast('Released with q₀ = '+(state.Q0*1000).toFixed(1)+' mC');
  else if (c.caseId==='forced') showToast('Driver at ωd = '+state.omega_d.toFixed(2)+' rad/s');
  else if (c.caseId==='utube') showToast('Released with x₀ = '+(state.A*1000).toFixed(1)+' mm');
  else showToast('Released from x₀ = '+state.A.toFixed(3)+' m');
});

document.getElementById('btnPause').addEventListener('click', ()=>{
  if (state.running){ state.running=false; setStatus('paused','Paused'); showToast('Paused'); }
  else { state.running=true; setStatus('running','Running'); showToast('Resumed'); }
});

document.getElementById('btnReset').addEventListener('click', ()=>{
  state.x=0; state.v=0; state.phi=0; state.t=0;
  state.history=[]; state.running=false;
  resetMeasurement(); setStatus('','Ready');
  showToast('Reset to equilibrium');
});

document.getElementById('vecToggle').addEventListener('change', e=>{
  showVectors = e.target.checked;
  showToast(showVectors ? 'Vectors on' : 'Vectors off');
});

function setStatus(cls, txt){
  document.getElementById('statusTag').className = 'status' + (cls?' '+cls:'');
  document.getElementById('statusText').textContent = txt;
}

let toastTimer = null;
function showToast(msg){
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space'){ e.preventDefault(); document.getElementById('btnPause').click(); }
  else if (e.key.toLowerCase()==='r'){ document.getElementById('btnRelease').click(); }
  else if (e.key.toLowerCase()==='c'){ document.getElementById('btnReset').click(); }
});

buildTabs();
buildParams();
switchCase(state.caseId);
requestAnimationFrame(loop);
setTimeout(()=>showToast('Drag any part · Vectors toggle · Space = pause'), 700);
</script>
